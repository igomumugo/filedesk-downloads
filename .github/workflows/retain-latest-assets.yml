name: Keep latest FileDesk installers
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filedesk-release-assets
  cancel-in-progress: false

jobs:
  retain:
    if: github.repository == 'igomumugo/filedesk-downloads' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current installers and remove previous attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/retain-latest-assets.py
